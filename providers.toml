[clis.grok.hooks]
files = ["home:hooks/herdr-agent-state.sh", "home:hooks/herdr.json"]

[clis.antigravity]
name = "Antigravity CLI"
executable = "agy"
# Its state lives in ~/.gemini with no variable to move it: a profile is a
# HOME of its own (the rest of the real HOME linked in). Its Google login is a
# file in that home on Linux and in containers (one account per profile); on
# macOS and Windows it sits in one OS-keyring slot per machine, so there a
# profile's own account is an API key.
isolation = "home"
home_dir = ".gemini"
auto = ["--dangerously-skip-permissions"]
interactive = ["{session}", "{auto}"]
docs = "https://antigravity.google/docs/cli"

[clis.antigravity.roots]
home = { default = "~/.gemini/antigravity-cli", profile = "{dir}/home/.gemini/antigravity-cli" }

[clis.antigravity.session]
continue = ["--continue"]
resume = ["--conversation", "{id}"]
pick_error = "agy has no conversation picker: resume one by its conversation_id (ak antigravity -r <id>) or the latest with -c"

[clis.antigravity.run]
argv = ["-p", "{prompt}", "{json}", "{auto}"]
json = ["--output-format", "json"]
result = "antigravity-json"

[clis.antigravity.login]
command = "agy"
# Linux and containers: agy keeps the Google login in this file of its home
# (no OS keyring reachable), so every profile has its own account. macOS and
# Windows: one OS-keyring slot per machine (the Keychain item below).
files = ["home:antigravity-oauth-token"]
env = ["GEMINI_API_KEY"]
definitive = false
note = "the Google login is a file in agy's home (Linux, containers) or one OS-keyring slot per machine (macOS, Windows); a profile's own account there is GEMINI_API_KEY_<SUFFIX>"
keychain = [{ service = "gemini", account = "antigravity", shared = true }]
profile_note = "On Linux and in containers this profile keeps its own Google login: sign in inside it. On macOS and Windows Antigravity keeps one OS-keyring login per machine, so signing in here replaces the login of every other Antigravity home; for a separate account there set GEMINI_API_KEY_{suffix} in the env file instead (ak writes modelProvider for it)."

[clis.antigravity.usage]
# agy's own /usage panel: the account's tier (loadCodeAssist) and its quota
# groups (retrieveUserQuotaSummary: Gemini models, Claude and GPT models, each
# with a five-hour and a weekly bucket), two POSTs the adapter makes to this host.
# The host tells the Antigravity client by the request metadata AND a user
# agent naming antigravity-cli (any other agent gets the generic Code Assist
# tiers and a 403 on the quota), so the kit names both itself and the CLI.
# The login is the token file above; the macOS Keychain item is an opaque blob
# the kit does not parse.
adapter = "antigravity-quota"
url = "https://cloudcode-pa.googleapis.com"
headers = { authorization = "Bearer {token}", content-type = "application/json", accept = "application/json", user-agent = "agentkit antigravity-cli" }
credential = "file"
files = ["home:antigravity-oauth-token"]
keychain_opaque = "the macOS Keychain login is in a format ak does not read; a profile on Linux or in a container keeps a readable login file"
timeout_s = 15

[clis.antigravity.install]
# The tarball the vendor's installer downloads (its per-platform manifest at
# antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/).
# The manifest publishes sha512; each download was checked against it and
# its sha256 recorded here.
channel = "tarball"
version = "1.3.3-5524738307653632"
url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/{version}/{platform}.tar.gz"
platforms = { linux-x64 = "linux-x64/cli_linux_x64", linux-arm64 = "linux-arm/cli_linux_arm64", macos-x64 = "darwin-x64/cli_mac_x64", macos-arm64 = "darwin-arm/cli_mac_arm64" }
sha256 = { linux-x64 = "8ee3ca32574c431285efbf4d4732f7f8d53e959370bc4a61646e4fa496f7f2b6", linux-arm64 = "a9d23fe1d7e5c8471881ab37723571a8d3f24e6ecace8fe082f8c0c8d90f41ca", macos-x64 = "78547d90bfd1559a87ba63e941f9332a0d1889d2de415da337dedec8dc9aa239", macos-arm64 = "c39926f3312e87eaa56d750658cf442669d0a716f49319d06369be7fa80520eb" }
strip = 0
into = "~/.local/share/antigravity-cli/versions/{version}"
links = { agy = "antigravity" }

# ----------------------------------------------------------- providers
# key: the secret variable; a named profile reads <key>_<SUFFIX> instead.
# companions: non-secret variables that follow the same suffix rule when set
# (unset ones keep the default profile's value). require: variables that
# must be set ("A|B" = one of them). vars: values the kinds' templates use.

[providers.zai]
name = "Z.AI GLM Coding Plan"
key = "ZAI_CODING_API_KEY"
companions = ["ZAI_CODING_BASE_URL", "ZAI_CODEX_BASE_URL", "ZAI_ANTHROPIC_BASE_URL"]
require = []

[providers.zai.usage]
adapter = "zai-quota"
url = "https://api.z.ai/api/monitor/usage/quota/limit"
headers = { authorization = "Bearer {token}", accept = "application/json" }
credential = "env"
timeout_s = 10

[providers.zai.vars]
anthropic_base = "{ZAI_ANTHROPIC_BASE_URL:-https://api.z.ai/api/anthropic}"
openai_base = "{ZAI_CODING_BASE_URL:-https://api.z.ai/api/coding/paas/v4}"
codex_base = "{ZAI_CODEX_BASE_URL:-https://api.z.ai/api/v1}"
opus = "{ZAI_DEFAULT_OPUS_MODEL:-glm-5.3}"
sonnet = "{ZAI_DEFAULT_SONNET_MODEL:-glm-5.3}"
haiku = "{ZAI_DEFAULT_HAIKU_MODEL:-glm-5.3-flash}"

[providers.azure]
name = "Azure OpenAI / Microsoft Foundry"
key = "AZURE_OPENAI_API_KEY"
companions = ["AZURE_OPENAI_RESOURCE", "AZURE_OPENAI_BASE_URL"]
# Deployment names are yours, so there is no default model to guess.
require = ["AZURE_OPENAI_RESOURCE|AZURE_OPENAI_BASE_URL", "AZURE_OPENAI_MODEL_DAILY"]

[providers.azure.usage]
unsupported = "Azure OpenAI exposes no quota to read; check the Azure portal"
short = "see the Azure portal"

[providers.azure.vars]
base = "{AZURE_OPENAI_BASE_URL:-https://{AZURE_OPENAI_RESOURCE}.services.ai.azure.com/openai/v1}"
daily = "{AZURE_OPENAI_MODEL_DAILY}"
reasoning = "{AZURE_OPENAI_MODEL_REASONING:-{AZURE_OPENAI_MODEL_DAILY}}"
default = "{AZURE_OPENAI_DEFAULT_MODEL:-{AZURE_OPENAI_MODEL_DAILY}}"

[providers.xai]
name = "xAI Grok"
key = "XAI_API_KEY"
companions = ["XAI_BASE_URL"]
require = []

[providers.xai.usage]
unsupported = "reading an xAI balance needs a separate management key, which ak never asks for"
short = "needs a management key"

[providers.xai.vars]
base = "{XAI_BASE_URL:-https://api.x.ai/v1}"
daily = "{XAI_MODEL_DAILY:-grok-4.3}"
reasoning = "{XAI_MODEL_REASONING:-grok-4.6}"
default = "{XAI_DEFAULT_MODEL:-{XAI_MODEL_DAILY:-grok-4.3}}"

[providers.gemini]
name = "Gemini API (Antigravity)"
key = "GEMINI_API_KEY"
companions = ["GOOGLE_GEMINI_BASE_URL"]
require = []

[providers.gemini.usage]
unsupported = "a Gemini API key exposes no quota to read; check Google AI Studio"
short = "see Google AI Studio"

# --------------------------------------------------------------- kinds
# cli: the canonical CLI. provider: a [providers] id. key_optional: a
# missing key is not an error (the CLI's own login is used instead).
# env: exported into the CLI's environment (an empty value is not set).
# args: the {provider} segment of the argv. writer: a merge-safe config
# writer run before launch. pre: a command run before the CLI (Cline auth).

[kinds.claude]
cli = "claude"

[kinds.claude-glm]
cli = "claude"
provider = "zai"

[kinds.claude-glm.env]
ANTHROPIC_AUTH_TOKEN = "{key}"
ANTHROPIC_BASE_URL = "{anthropic_base}"
API_TIMEOUT_MS = "{ZAI_CODING_API_TIMEOUT_MS:-3000000}"
ANTHROPIC_DEFAULT_OPUS_MODEL = "{opus}"
ANTHROPIC_DEFAULT_SONNET_MODEL = "{sonnet}"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "{haiku}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "{ZAI_CODING_AUTO_COMPACT_WINDOW}"

[kinds.codex]
cli = "codex"

[kinds.codex-glm]
cli = "codex"
provider = "zai"
args = ["-p", "glm"]
writer = { type = "codex", file = "home:glm.config.toml", provider_id = "ZAI", name = "Z.AI GLM Coding Plan", base_url = "{codex_base}", model = "{ZAI_CODEX_DEFAULT_MODEL:-{sonnet}}" }

[kinds.codex-azure]
cli = "codex"
provider = "azure"
args = ["-p", "azure"]
writer = { type = "codex", file = "home:azure.config.toml", provider_id = "azure", name = "Azure OpenAI / Microsoft Foundry", base_url = "{base}", model = "{default}" }

[kinds.codex-xai]
cli = "codex"
provider = "xai"
args = ["-p", "xai"]
writer = { type = "codex", file = "home:xai.config.toml", provider_id = "xai", name = "xAI Grok", base_url = "{base}", model = "{default}" }

[kinds.cursor]
cli = "cursor"

[kinds.opencode]
cli = "opencode"

[kinds.opencode-glm]
cli = "opencode"
provider = "zai"
args = ["-m", "zai-coding-plan/{ZAI_OPENCODE_DEFAULT_MODEL:-{sonnet}}"]
writer = { type = "opencode", file = "{OPENCODE_CONFIG:-{root.config}/opencode.json}", provider_id = "zai-coding-plan", base_url = "{openai_base}", models = ["{sonnet}", "{opus}", "{haiku}"] }

[kinds.opencode-glm.env]
ZHIPU_API_KEY = "{key}"
ZAI_API_KEY = "{key}"

[kinds.opencode-azure]
cli = "opencode"
provider = "azure"
args = ["-m", "azure/{default}"]
writer = { type = "opencode", file = "{OPENCODE_CONFIG:-{root.config}/opencode.json}", provider_id = "azure", base_url = "{base}", models = ["{daily}", "{reasoning}"] }

[kinds.opencode-xai]
cli = "opencode"
provider = "xai"
args = ["-m", "xai/{default}"]
writer = { type = "opencode", file = "{OPENCODE_CONFIG:-{root.config}/opencode.json}", provider_id = "xai", base_url = "{base}", models = ["{daily}", "{reasoning}"] }

[kinds.pi]
cli = "pi"

[kinds.pi-glm]
cli = "pi"
provider = "zai"
args = ["--provider", "zai-glm", "--model", "{ZAI_PI_DEFAULT_MODEL:-{sonnet}}", "--models", "{models}"]
writer = { type = "pi", file = "home:models.json", provider_id = "zai-glm", base_url = "{openai_base}", context_window = 1000000, max_tokens = 131072, reasoning_effort = false, models = ["{sonnet}:sonnet", "{opus}:opus", "{haiku}:haiku"] }

[kinds.pi-glm.env]
ZAI_API_KEY = "{key}"

[kinds.pi-azure]
cli = "pi"
provider = "azure"
args = ["--provider", "azure-foundry", "--model", "{default}", "--models", "{models}"]
writer = { type = "pi", file = "home:models.json", provider_id = "azure-foundry", base_url = "{base}", context_window = 200000, max_tokens = 32768, reasoning_effort = true, models = ["{daily}:daily", "{reasoning}:reasoning"] }

[kinds.pi-xai]
cli = "pi"
provider = "xai"
args = ["--provider", "xai-grok", "--model", "{default}", "--models", "{models}"]
writer = { type = "pi", file = "home:models.json", provider_id = "xai-grok", base_url = "{base}", context_window = 200000, max_tokens = 32768, reasoning_effort = true, models = ["{daily}:daily", "{reasoning}:reasoning"] }

[kinds.cline]
cli = "cline"

[kinds.cline-azure]
cli = "cline"
provider = "azure"
args = ["-P", "openai", "-m", "{default}", "-k", "{key}"]
pre = ["auth", "-p", "openai", "-b", "{base}", "-k", "{key}", "-m", "{default}"]

[kinds.cline-xai]
cli = "cline"
provider = "xai"
args = ["-P", "openai", "-m", "{default}", "-k", "{key}"]
pre = ["auth", "-p", "openai", "-b", "{base}", "-k", "{key}", "-m", "{default}"]

[kinds.grok]
cli = "grok"
provider = "xai"
key_optional = true

[kinds.antigravity]
cli = "antigravity"
provider = "gemini"
key_optional = true
# With the profile's key, agy needs modelProvider = "gemini" in its
# settings.json; without it the key must not be named there, or agy refuses
# to start. The writer keeps that one field in step and nothing else.
writer = { type = "antigravity", file = "home:settings.json" }
