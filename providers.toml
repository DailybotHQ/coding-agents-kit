# providers.toml — the kinds model of coding-agents-kit (schema 1).
#
# Kinds are data, not code: adding a kind is an entry here plus a test.
# Read by lib/kinds.py (tomllib on python >= 3.11, lib/tomlmini.py before).
# The full reference is docs/kinds.md; the short version:
#
#   [clis.<cli>]       one per canonical CLI: executable, profile isolation,
#                      roots, session-flag mapping, autonomy flag, headless
#                      mapping, login probe, install channel, Herdr hooks
#   [providers.<id>]   an API provider: key variable, companions, variables
#   [kinds.<kind>]     what `ak <kind>` launches: a CLI, optionally with a
#                      provider and its env / arguments / config writer
#
# Templates: {NAME} reads the environment (upper case), {name} reads a
# variable (lower case: provider and kind variables, root.<name>, dir, id,
# prompt, cwd, seconds, kind, profile), {X:-default} falls back when X is
# empty, and defaults nest. {key} is the profile's provider key: it is only
# ever placed in the CLI's environment (or, for Cline, its argv) — never
# printed, logged or written. A leading ~ is the user's home. An argv list
# element that is exactly {provider}, {session}, {auto}, {json} or {timeout}
# expands to a list (possibly empty).

schema = 1

# ---------------------------------------------------------------- CLIs

[clis.claude]
name = "Claude Code"
executable = "claude"
herdr_kind = "claude"
isolation = "env"
home_env = "CLAUDE_CONFIG_DIR"
# A long-lived login token per account (`claude setup-token`): @default reads
# CLAUDE_CODE_OAUTH_TOKEN, @name reads CLAUDE_CODE_OAUTH_TOKEN_<SUFFIX> and gets
# it as CLAUDE_CODE_OAUTH_TOKEN; never a fallback to another account's token.
profile_token_var = "CLAUDE_CODE_OAUTH_TOKEN"
auto = ["--dangerously-skip-permissions"]
interactive = ["{provider}", "{session}", "{auto}"]
docs = "https://docs.claude.com/en/docs/claude-code"

[clis.claude.roots]
home = { default = "{CLAUDE_CONFIG_DIR:-~/.claude}", profile = "{dir}" }
account = { default = "{CLAUDE_CONFIG_DIR:-~}", profile = "{dir}" }

# `--trust-cwd` (explicit opt-in): where the folder-trust answer lives.
[clis.claude.trust]
file = "account:.claude.json"
format = "claude-json"

[clis.claude.session]
continue = ["--continue"]
resume = ["--resume", "{id}"]
pick = ["--resume"]

[clis.claude.run]
argv = ["{provider}", "-p", "{prompt}", "{json}", "{auto}"]
json = ["--output-format", "json"]
result = "json-result"

[clis.claude.login]
files = ["account:.claude.json"]
marker = "oauthAccount"
env = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN", "CLAUDE_CODE_USE_BEDROCK", "CLAUDE_CODE_USE_VERTEX"]
definitive = true
# `.claude.json` names the account; the token is `.credentials.json` (Linux)
# or a macOS Keychain item, "<service>-<first 8 hex of sha256(dir)>" for a
# profile directory.
token_files = ["home:.credentials.json"]
keychain = [{ service = "Claude Code-credentials", profile = true }]
note = "on macOS the token itself lives in the Keychain, one entry per profile directory"

# `ak usage` source (lib/usage.py). The endpoint is vendor-internal and
# unofficial; {token} is resolved only into the request header.
[clis.claude.usage]
adapter = "anthropic-oauth"
url = "https://api.anthropic.com/api/oauth/usage"
headers = { authorization = "Bearer {token}", anthropic-beta = "oauth-2025-04-20", accept = "application/json" }
credential = "file"
files = ["home:.credentials.json"]
keychain = "Claude Code-credentials"
# a profile's login is "<keychain>-<first 8 hex of sha256(profile dir)>"
keychain_profile = true
timeout_s = 10

[clis.claude.install]
# Native binary. sha256: the vendor's release manifest
# (downloads.claude.ai/claude-code-releases/2.1.295/manifest.json).
channel = "binary"
version = "2.1.295"
url = "https://downloads.claude.ai/claude-code-releases/{version}/{platform}/claude"
platforms = { linux-x64 = "linux-x64", linux-arm64 = "linux-arm64", macos-x64 = "darwin-x64", macos-arm64 = "darwin-arm64" }
sha256 = { linux-x64 = "4503bfe11a6c7fcc1e0b39b5e0d347c04248f750b03b0977b3ad6b531fe6f358", linux-arm64 = "cfb9dc1332fb6f92a683f835823e91b3179a803398ca7852cd2381a3cb1dea3b", macos-x64 = "a6066492288585a1ef5e482cb28ad22714ab12cd48e367c0cee988b00cff724c", macos-arm64 = "0116ee2e0a513900b633d9951367f18747686478e2b462805b8c31609f047f70" }

[clis.claude.hooks]
files = ["home:hooks/herdr-agent-state.sh"]
register = "home:settings.json"


[clis.codex]
name = "Codex"
executable = "codex"
herdr_kind = "codex"
isolation = "env"
home_env = "CODEX_HOME"
lease = "exclusive"   # ak lease: one writer per auth.json
auto = ["--dangerously-bypass-approvals-and-sandbox"]
interactive = ["{provider}", "{session}", "{auto}"]
docs = "https://developers.openai.com/codex/cli"

[clis.codex.roots]
home = { default = "{CODEX_HOME:-~/.codex}", profile = "{dir}" }

[clis.codex.trust]
file = "home:config.toml"
format = "codex-toml"

[clis.codex.session]
continue = ["resume", "--last"]
resume = ["resume", "{id}"]
pick = ["resume", "--all"]
last = "continue"

[clis.codex.run]
argv = ["exec", "{provider}", "{json}", "-C", "{cwd}", "{auto}", "{prompt}"]
json = ["--json"]
result = "codex-jsonl"

[clis.codex.login]
command = "codex login"
files = ["home:auth.json"]
env = ["CODEX_API_KEY", "OPENAI_API_KEY"]
definitive = true

[clis.codex.usage]
adapter = "chatgpt-wham"
url = "https://chatgpt.com/backend-api/wham/usage"
headers = { authorization = "Bearer {token}", accept = "application/json" }
credential = "file"
files = ["home:auth.json"]
timeout_s = 10

[clis.codex.install]
# integrity: the npm registry's dist.integrity for this version.
channel = "npm"
package = "@openai/codex"
version = "0.158.0"
integrity = "sha512-GBhcKpQmVLsCtEP5mUf6WFye6QQgTKotwsXrYPM0GFmEsoOSahik6hkf2FHabX9kZBl0Y0/PQowLu7uYMKT8dg=="

[clis.codex.hooks]
files = ["home:herdr-agent-state.sh"]
register = "home:hooks.json"

[clis.codex.daemon]
# Codex installs an app-server daemon under its home and records it there. A
# home shared with another machine (a host profile mounted into a container,
# one volume shared by several containers) records a daemon that is not on
# this machine, and Codex refuses to start. When `record` exists and
# `executable` is missing or not built for this OS, or `env` is 1, an
# interactive launch adds `off`; never when the daemon is here.
record = "home:packages/app-server-daemon"
executable = "home:packages/app-server-daemon/current/bin/codex"
off = ["--no-daemon"]
env = "AGENTKIT_CODEX_NO_DAEMON"
# A daemon that is already running keeps the environment of whoever started
# it, and Codex runs its tool shells from it: an interactive launch that will
# reuse it (daemon present) passes the account marker per session, so
# `ak capacity --self` inside the session names this launch's account.
marker = ["-c", "shell_environment_policy.set.AGENTKIT_ACTIVE_ACCOUNT=\"{account}\""]


[clis.cursor]
name = "Cursor Agent"
executable = "agent"
resolver = "cursor"
herdr_kind = "cursor"
isolation = "cursor-home"
auto = ["--force"]
interactive = ["{session}", "{auto}"]
docs = "https://cursor.com/docs/cli"

[clis.cursor.roots]
home = { default = "~/.cursor", profile = "{dir}/home/.cursor" }
# Linux keeps the default login at ~/.config/cursor/auth.json (XDG). A profile's
# HOME links the real ~/.config in, so its xdg root stays its own .cursor: a
# profile never reads the default account's login.
xdg = { default = "~/.config/cursor", profile = "{dir}/home/.cursor" }

[clis.cursor.session]
continue = ["--continue"]
resume = ["--resume={id}"]
pick = ["--resume"]
list = ["ls"]
last = "list"
standalone = ["list"]

[clis.cursor.run]
argv = ["-p", "{prompt}", "{json}", "--trust", "{auto}"]
json = ["--output-format", "json"]
result = "json-result"

[clis.cursor.login]
command = "agent login"
files = ["home:auth.json", "xdg:auth.json"]
env = ["CURSOR_API_KEY"]
definitive = false
note = "the default home on macOS keeps the login in the Keychain, on Linux in ~/.config/cursor/auth.json; profiles use the file store"
# The default home's Keychain item (presence only; read by nothing).
keychain = [{ service = "cursor-access-token" }]

[clis.cursor.usage]
unsupported = "usage is only available through the Cursor web session; not read by ak"
short = "web session only"

[clis.cursor.install]
# The versioned package the vendor's installer downloads. The vendor
# publishes no checksum: the sha256 values were recorded when this pin was
# taken (trust on first use; the linux values match an independent pin).
channel = "tarball"
version = "2026.10.01-e373342"
url = "https://downloads.cursor.com/lab/{version}/{platform}/agent-cli-package.tar.gz"
platforms = { linux-x64 = "linux/x64", linux-arm64 = "linux/arm64", macos-x64 = "darwin/x64", macos-arm64 = "darwin/arm64" }
sha256 = { linux-x64 = "a79726c6e644520e993970be4c45775a6889802b67abe461a677a53219ae28e8", linux-arm64 = "785c5f6bf2a60eb1121e27ed8c14f5ee07ed1b5b6692324f2d9a997238245eb5", macos-x64 = "a80db6e15626e0aa7af60fab3a95c98a243e2c1513c0c9485344a553d7b7b00e", macos-arm64 = "629e51de43a0b7fb3b86f5ebc7e579f7df7df941b39f29e82945cde750145afc" }
strip = 1
into = "~/.local/share/cursor-agent/versions/{version}"
links = { cursor-agent = "cursor-agent", agent = "cursor-agent" }

[clis.cursor.hooks]
files = ["home:herdr-agent-state.sh"]
register = "home:hooks.json"


[clis.opencode]
name = "OpenCode"
executable = "opencode"
herdr_kind = "opencode"
isolation = "xdg"
auto = ["--auto"]
interactive = ["{auto}", "{provider}", "{session}"]
