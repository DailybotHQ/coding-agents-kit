[clis.pi]
name = "Pi"
executable = "pi"
herdr_kind = "pi"
isolation = "env"
home_env = "PI_CODING_AGENT_DIR"
auto = ["--approve"]
interactive = ["{auto}", "{provider}", "{session}"]
