name: release

# An annotated vX.Y.Z (or vX.Y.Z-beta.N / -rc.N) tag pushed to this repository becomes
# a GitHub release: the tag is checked against lib/common.py VERSION and the
# CHANGELOG, the suite and the public-hygiene check run, and the release gets
# the changelog section as notes, the source tarball and SHA256SUMS.
on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Check the tag
        run: bash scripts/release.sh check "${GITHUB_REF_NAME}"
      - name: Full suite
        run: bash tests/run.sh
      - name: Public hygiene
        run: bash scripts/check-public-hygiene.sh
      - name: Build tarball, SHA256SUMS and notes
        run: bash scripts/release.sh build "${GITHUB_REF_NAME}" dist
      - name: Publish the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          flags=()
          case "${tag}" in *-*) flags+=(--prerelease --latest=false) ;; esac
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "${tag}" --verify-tag --title "coding-agents-kit ${tag}" \
              --notes-file dist/NOTES.md "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS
          fi
