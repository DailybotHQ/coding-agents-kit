name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No private context or secret-shaped string in tracked files
        run: bash scripts/check-public-hygiene.sh

  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The full suite includes the usage scopes (ak usage against a loopback
      # fake endpoint), so macOS covers the Keychain-free path natively too.
      - name: Full suite (sandbox HOME, fakes only, no network)
        run: bash tests/run.sh

  python39:
    name: suite on python 3.9 (oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Full suite under python 3.9
        run: AK_TEST_PYTHON="$(command -v python)" bash tests/run.sh

  windows:
    name: windows layer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PowerShell parses install.ps1 and win/
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path . -Include *.ps1,*.psm1 -Recurse -File | Where-Object { $_.FullName -notmatch '\\\.(git|agents|dwp)\\' })
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { throw "parse errors in $($f.FullName): $errs" }
            Write-Output "parsed $($f.FullName)"
          }
      - name: install.ps1 installs, and ak.cmd runs the python core natively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'agentkit'
          $envFile = Join-Path $env:RUNNER_TEMP 'agentkit-env'
          ./install.ps1 -NoPath -Prefix $prefix -EnvFile $envFile
          ./install.ps1 -NoPath -Prefix $prefix -EnvFile $envFile   # idempotent
          $env:AGENTKIT_ENV = $envFile
          & "$prefix\bin\ak.cmd" --version
          $doc = & "$prefix\bin\ak.cmd" doctor --json | ConvertFrom-Json
          if ($doc.interface -ne 1) { throw "doctor interface is $($doc.interface)" }
          if ($doc.os -ne 'windows') { throw "doctor os is $($doc.os)" }
          & "$prefix\bin\ak.cmd" env claude
          ./install.ps1 -NoPath -Uninstall -Prefix $prefix -EnvFile $envFile
          if (Test-Path "$prefix\lib") { throw 'uninstall left lib behind' }
      - name: ak usage and ak pick checks run natively (no bash)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('tests/py/usage_checks.py', 'tests/py/usage_provider_checks.py', 'tests/py/pick_checks.py', 'tests/py/capacity_checks.py')) {
            $out = & python $script
            if ($LASTEXITCODE -ne 0) { throw "$script failed: $($out | Select-String '^FAIL')" }
            Write-Output "$script : $(@($out | Select-String '^ok').Count) checks ok"
          }
      - name: ak.cmd usage runs against a loopback fake endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'usage-smoke'
          $prefix = Join-Path $tmp 'agentkit'
          $envFile = Join-Path $tmp 'agentkit-env'
          $userHome = Join-Path $tmp 'home'
          $profiles = Join-Path $tmp 'profiles'
          New-Item -ItemType Directory -Force -Path $userHome, "$profiles\claude\smoke" | Out-Null
          ./install.ps1 -NoPath -Prefix $prefix -EnvFile $envFile
          $fake = 'fake-smoke-login'
          $login = '{"claudeAiOauth":{"accessToken":"' + $fake + '","expiresAt":99999999999999,"scopes":["user:profile"],"subscriptionType":"max"}}'
          [System.IO.File]::WriteAllText("$profiles\claude\smoke\.credentials.json", $login)
          $routes = Join-Path $tmp 'routes.json'
          $body = '{"/claude":{"json":{"five_hour":{"utilization":42,"resets_at":"2099-01-01T00:00:00Z"},"seven_day":{"utilization":13,"resets_at":"2099-01-05T00:00:00Z"}}}}'
          [System.IO.File]::WriteAllText($routes, $body)
          $portFile = Join-Path $tmp 'port.txt'
          $server = Start-Process -FilePath python -ArgumentList @('tests/py/fake_usage_server.py', '--routes', $routes, '--port-file', $portFile) -PassThru -WindowStyle Hidden
          try {
            for ($i = 0; $i -lt 40 -and -not (Test-Path $portFile); $i++) { Start-Sleep -Milliseconds 250 }
            $port = (Get-Content $portFile -Raw).Trim()
            $env:HOME = $userHome
            $env:USERPROFILE = $userHome
            $env:AGENTKIT_ENV = $envFile
            $env:AGENTKIT_PROFILES_DIR = $profiles
            $env:AGENTKIT_USAGE_URL_ANTHROPIC_OAUTH = "http://127.0.0.1:$port/claude"
            $doc = & "$prefix\bin\ak.cmd" usage claude '@smoke' --json | ConvertFrom-Json
            if ($doc.schema -ne 'usage-v1' -or $doc.interface -ne 1) { throw "unexpected usage document: schema=$($doc.schema) interface=$($doc.interface)" }
            $row = $doc.rows[0]
            if ($row.status -ne 'ok' -or $row.windows[0].used_pct -ne 42) { throw "unexpected row: status=$($row.status)" }
            & "$prefix\bin\ak.cmd" usage claude '@smoke' --no-color
            if ($LASTEXITCODE -ne 0) { throw "ak.cmd usage exited $LASTEXITCODE" }
          } finally {
            if ($server) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: ak setup checks run natively (no bash)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & python tests/py/setup_checks.py
          if ($LASTEXITCODE -ne 0) { throw "setup_checks.py failed: $($out | Select-String '^FAIL')" }
          Write-Output "setup_checks.py : $(@($out | Select-String '^ok').Count) checks ok"
      - name: ak.cmd setup probe and verify through a temp install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'setup-smoke'
          $prefix = Join-Path $tmp 'agentkit'
          $envFile = Join-Path $tmp 'agentkit-env'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          ./install.ps1 -NoPath -Prefix $prefix -EnvFile $envFile
          $env:AGENTKIT_HOME = $prefix
          $env:AGENTKIT_ENV = $envFile
          $probe = & "$prefix\bin\ak.cmd" setup probe --json | ConvertFrom-Json
          if ($probe.schema -ne 'setup-probe-v1' -or $probe.interface -ne 1) { throw "unexpected probe: $($probe.schema)" }
          if ($probe.os -ne 'windows' -or $probe.install.found -ne $true) { throw "probe os=$($probe.os) install.found=$($probe.install.found)" }
          $verify = & "$prefix\bin\ak.cmd" setup verify --json | ConvertFrom-Json
          if ($verify.schema -ne 'setup-verify-v1') { throw "unexpected verify: $($verify.schema)" }
          py -3 "$prefix\lib\ak.py" setup probe --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the core started directly exited $LASTEXITCODE" }
          ./install.ps1 -NoPath -Uninstall -Prefix $prefix -EnvFile $envFile

  docker-recipe:
    name: docker recipe builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Opt-in scope: renders the Dockerfile for the published v0.3.0 tarball and
      # its digest, builds it with Docker and runs `ak doctor` in the image.
      - name: Render, build and run the container recipe
        run: AGENTKIT_TEST_LIVE=1 bash tests/run.sh setup-docker-live

